name: Lyra alpha checks
on:
  push:
    branches: [master, main, 'alpha/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify bundle, numerical tests, browser audio and isolated playback
        run: python scripts/verify.py
      - name: Preserve verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyra-verification
          path: evidence/lyra-verification/
